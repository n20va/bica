[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bica-illusions"
version = "0.1.0"
description = "Reproducible experiments on alternative interpretations and misleading cues"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bica-illusions = "illusion_agent.cli:main"

[tool.setuptools.packages.find]
include = ["illusion_agent*"]

[tool.setuptools.package-data]
illusion_agent = ["prompts/*.txt"]
